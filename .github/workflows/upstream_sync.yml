name: Gated upstream sync

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  propose-upstream-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream main into a review branch
        id: merge
        shell: bash
        run: |
          git remote add upstream https://github.com/MorpheApp/morphe-patches.git
          git fetch upstream main
          git fetch origin automation/upstream-sync || true
          if git show-ref --verify --quiet refs/remotes/origin/automation/upstream-sync; then
            git switch --track -c automation/upstream-sync origin/automation/upstream-sync
          else
            git switch -c automation/upstream-sync
          fi
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-ff --no-edit upstream/main
          git push --set-upstream origin automation/upstream-sync
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Open or update review pull request
        if: steps.merge.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          existing=$(gh pr list --base dev --head "$GITHUB_REPOSITORY_OWNER:automation/upstream-sync" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create --base dev --head automation/upstream-sync \
              --title 'chore: sync upstream Morphe patches' \
              --body 'This pull request proposes the latest upstream `main` changes for review on `dev`. Review the build and compatibility results before merging. Nothing is published automatically.'
          fi
