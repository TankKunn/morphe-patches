name: CI-gated upstream sync and prerelease

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/upstream_sync.yml
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: morphe-patch-releases
  cancel-in-progress: false

jobs:
  sync-test-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create repository automation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MORPHE_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MORPHE_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: morphe-patches
          permission-contents: write
          permission-workflows: write

      - name: Checkout fork dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up build tools
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Prepare upstream dev candidate
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/upstream-sync.log") 2>&1
          trap 'status=$?; git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt" || true; git status --short >> "$RUNNER_TEMP/conflicts.txt" || true; echo "Upstream preparation failed with status $status"; exit $status' ERR
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/MorpheApp/morphe-patches.git
          git fetch upstream dev
          git fetch origin dev
          OLD_DEV="$(git rev-parse origin/dev)"
          UPSTREAM_DEV="$(git rev-parse upstream/dev)"
          if git merge-base --is-ancestor "$UPSTREAM_DEV" "$OLD_DEV"; then
            echo 'No new upstream dev commits; nothing to sync.'
            echo 'updated=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git switch --force-create automation/upstream-sync "$UPSTREAM_DEV"
          git checkout "$OLD_DEV" -- \
            AGENTS.md .github/workflows/release.yml .github/workflows/open_pull_request.yml \
            .github/workflows/build_pull_request.yml .github/scripts/apply_magnifier_overlay.py \
            .github/scripts/verify_magnifier_bundle.py .releaserc README.md \
            extensions/youtube/src/main/java/app/morphe/extension/youtube/videoplayer/MagnifierRecon.java \
            patches/src/main/kotlin/app/morphe/patches/youtube/layout/player/buttons/MagnifierReconPatch.kt
          python3 .github/scripts/apply_magnifier_overlay.py --source-ref "$OLD_DEV"
          git add -A
          git diff --cached --check
          git commit -m 'fix: sync upstream dev patches with magnifier'
          echo "old_dev=$OLD_DEV" >> "$GITHUB_OUTPUT"
          echo "upstream_dev=$UPSTREAM_DEV" >> "$GITHUB_OUTPUT"
          echo "sync_tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo 'updated=true' >> "$GITHUB_OUTPUT"

      - name: Run patch and extension tests
        if: steps.prepare.outputs.updated == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_GPR_USER: ${{ secrets.MORPHE_GPR_USER || github.actor }}
          MORPHE_GPR_KEY: ${{ secrets.MORPHE_GPR_KEY || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/upstream-sync.log") 2>&1
          ./gradlew :patches:test :extensions:youtube:testDebugUnitTest --no-daemon

      - name: Build and lint candidate bundle
        if: steps.prepare.outputs.updated == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_GPR_USER: ${{ secrets.MORPHE_GPR_USER || github.actor }}
          MORPHE_GPR_KEY: ${{ secrets.MORPHE_GPR_KEY || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/upstream-sync.log") 2>&1
          ./gradlew :patches:buildAndroid generatePatchesList --no-daemon
          version="$(sed -n 's/^version = //p' gradle.properties | tail -n 1)"
          jq --arg v "$version" '.version = $v' patches-list.json > patches-list.json.tmp
          mv patches-list.json.tmp patches-list.json
          bundle="patches/build/libs/patches-${version}.mpp"
          test -f "$bundle"
          python3 .github/scripts/verify_magnifier_bundle.py \
            --bundle "$bundle" --patch-list patches-list.json

      - name: Push tested upstream sync commit
        if: steps.prepare.outputs.updated == 'true'
        shell: bash
        env:
          OLD_DEV: ${{ steps.prepare.outputs.old_dev }}
          UPSTREAM_DEV: ${{ steps.prepare.outputs.upstream_dev }}
          SYNC_TREE: ${{ steps.prepare.outputs.sync_tree }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/upstream-sync.log") 2>&1
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$OLD_DEV"
          sync_commit="$(printf '%s\n' 'fix: sync upstream dev patches with magnifier' | \
            GIT_AUTHOR_NAME='github-actions[bot]' \
            GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            GIT_COMMITTER_NAME='github-actions[bot]' \
            GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            git commit-tree "$SYNC_TREE" -p "$OLD_DEV" -p "$UPSTREAM_DEV")"
          git push origin "$sync_commit:refs/heads/dev"

      - name: Open failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          conflicts="$(cat "$RUNNER_TEMP/conflicts.txt" 2>/dev/null || true)"
          tail_log="$(tail -n 80 "$RUNNER_TEMP/upstream-sync.log" 2>/dev/null | sed -E 's/(github_pat_|gh[pousr]_)[A-Za-z0-9_]{20,}/[REDACTED]/g' || true)"
          body="Weekly upstream dev sync failed before the candidate was pushed; the previous dev bundle remains available.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Conflicting/status files:
          \`\`\`
          ${conflicts:-No conflict paths were recorded.}
          \`\`\`

          Sanitized log tail:
          \`\`\`
          ${tail_log:-No command log was captured.}
          \`\`\`"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Upstream dev sync failed (run $GITHUB_RUN_NUMBER)" --body "$body" \
            || echo 'Could not create issue; confirm repository Issues are enabled.'
