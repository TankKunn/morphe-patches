name: Gated dev prerelease

on:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish the built bundle as a dev prerelease
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install release dependencies
        run: npm ci

      - name: Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_GPR_USER: ${{ secrets.MORPHE_GPR_USER || github.actor }}
          MORPHE_GPR_KEY: ${{ secrets.MORPHE_GPR_KEY || secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:test :extensions:youtube:testDebugUnitTest --no-daemon

      - name: Build Android bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_GPR_USER: ${{ secrets.MORPHE_GPR_USER || github.actor }}
          MORPHE_GPR_KEY: ${{ secrets.MORPHE_GPR_KEY || secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Upload bundle for review
        if: inputs.publish_prerelease != true
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: patches/build/libs/*.mpp

      # The fork begins without its own release tags. Seed semantic-release at
      # the fork's pre-magnifier baseline once, so the first release only
      # includes fork changes instead of the full upstream history.
      - name: Seed fork dev release baseline
        if: inputs.publish_prerelease == true
        run: |
          if ! git tag --list 'v1.0.0-dev.*' | grep -q .; then
            git tag v1.0.0-dev.0 9835f3f90a87e3f8d098ba8cfdd182237b748ddd
            git push origin refs/tags/v1.0.0-dev.0
          fi

      - name: Publish dev prerelease
        if: inputs.publish_prerelease == true
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_GPR_USER: ${{ secrets.MORPHE_GPR_USER || github.actor }}
          MORPHE_GPR_KEY: ${{ secrets.MORPHE_GPR_KEY || secrets.GITHUB_TOKEN }}
