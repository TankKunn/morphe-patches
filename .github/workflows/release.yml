name: Gated dev prerelease

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish the built bundle as a dev prerelease
        type: boolean
        required: true
        default: false
      sanitize_history:
        description: One-time rewrite of TankKunn author metadata to GitHub noreply
        type: boolean
        required: true
        default: false

permissions:
  contents: write

# Share a lock with upstream sync so semantic-release never pushes from a stale SHA.
concurrency:
  group: morphe-dev-publish
  cancel-in-progress: false

jobs:
  sanitize-history:
    if: github.ref == 'refs/heads/dev' && inputs.sanitize_history == true
    runs-on: ubuntu-latest
    steps:
      - name: Create repo-scoped rewrite token
        id: rewrite-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MORPHE_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MORPHE_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: morphe-patches
          permission-contents: write
          permission-workflows: write

      - name: Checkout full dev history
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ steps.rewrite-token.outputs.token }}

      - name: Rewrite owner metadata and verify trees
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git update-ref refs/original/refs/heads/dev refs/heads/dev
          git filter-branch --force --env-filter '
            noreply="337249693+TankKunn@users.noreply.github.com"
            if [ "$GIT_AUTHOR_NAME" = "TankKunn" ] && [ "$GIT_AUTHOR_EMAIL" != "$noreply" ]; then
              export GIT_AUTHOR_EMAIL="$noreply"
            fi
            if [ "$GIT_COMMITTER_NAME" = "TankKunn" ] && [ "$GIT_COMMITTER_EMAIL" != "$noreply" ]; then
              export GIT_COMMITTER_EMAIL="$noreply"
            fi
          ' refs/heads/dev
          git log --reverse --format=%T refs/original/refs/heads/dev > /tmp/original-trees
          git log --reverse --format=%T refs/heads/dev > /tmp/rewritten-trees
          cmp /tmp/original-trees /tmp/rewritten-trees
          noreply='337249693+TankKunn@users.noreply.github.com'
          bad_author="$(git log refs/heads/dev --format='%an%x09%ae' | awk -F '	' -v n="$noreply" '$1 == "TankKunn" && $2 != n { c++ } END { print c+0 }')"
          bad_committer="$(git log refs/heads/dev --format='%cn%x09%ce' | awk -F '	' -v n="$noreply" '$1 == "TankKunn" && $2 != n { c++ } END { print c+0 }')"
          test "$bad_author" = 0
          test "$bad_committer" = 0
          echo "History verified: commit trees unchanged; owner author/committer metadata uses noreply."
          git push --force-with-lease=refs/heads/dev:$EXPECTED_HEAD origin refs/heads/dev:refs/heads/dev

  build:
    if: github.ref == 'refs/heads/dev' && inputs.sanitize_history != true
    runs-on: ubuntu-latest
    steps:
      - name: Create repo-scoped release token
        if: github.event_name == 'push' || inputs.publish_prerelease == true
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MORPHE_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MORPHE_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: morphe-patches
          permission-contents: write
          permission-workflows: write

      - name: Checkout current dev head
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install release dependencies
        run: npm ci

      - name: Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_GPR_USER: ${{ secrets.MORPHE_GPR_USER || github.actor }}
          MORPHE_GPR_KEY: ${{ secrets.MORPHE_GPR_KEY || secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:test :extensions:youtube:testDebugUnitTest --no-daemon

      - name: Build Android bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_GPR_USER: ${{ secrets.MORPHE_GPR_USER || github.actor }}
          MORPHE_GPR_KEY: ${{ secrets.MORPHE_GPR_KEY || secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Upload bundle for review
        if: inputs.publish_prerelease != true && github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: patches/build/libs/*.mpp

      - name: Seed fork dev release baseline
        if: github.event_name == 'push' || inputs.publish_prerelease == true
        run: |
          if ! git tag --list 'v1.48.0' | grep -q .; then
            git tag v1.48.0 f3acc10e2
          fi

      - name: Publish dev prerelease
        if: github.event_name == 'push' || inputs.publish_prerelease == true
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token || secrets.GITHUB_TOKEN }}
          MORPHE_GPR_USER: ${{ secrets.MORPHE_GPR_USER || github.actor }}
          MORPHE_GPR_KEY: ${{ secrets.MORPHE_GPR_KEY || secrets.GITHUB_TOKEN }}
