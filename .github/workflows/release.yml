name: Gated dev prerelease

on:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish the built bundle as a dev prerelease
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Create repo-scoped release token
        if: inputs.publish_prerelease == true
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MORPHE_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MORPHE_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: morphe-patches
          permission-contents: write
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install release dependencies
        run: npm ci

      - name: Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_GPR_USER: ${{ secrets.MORPHE_GPR_USER || github.actor }}
          MORPHE_GPR_KEY: ${{ secrets.MORPHE_GPR_KEY || secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:test :extensions:youtube:testDebugUnitTest --no-daemon

      - name: Build Android bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_GPR_USER: ${{ secrets.MORPHE_GPR_USER || github.actor }}
          MORPHE_GPR_KEY: ${{ secrets.MORPHE_GPR_KEY || secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Upload bundle for review
        if: inputs.publish_prerelease != true
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: patches/build/libs/*.mpp

      # The fork begins without its own release tags. Seed semantic-release at
      # the last upstream stable release so its first prerelease contains only
      # fork changes instead of the full upstream history. A stable tag is
      # required here because semantic-release does not accept a bare dev tag
      # until GitHub has recorded that tag on the dev channel.
      - name: Seed fork dev release baseline
        if: inputs.publish_prerelease == true
        run: |
          if ! git tag --list 'v1.48.0' | grep -q .; then
            git tag v1.48.0 f3acc10e2
          fi

      - name: Publish dev prerelease
        if: inputs.publish_prerelease == true
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token || secrets.GITHUB_TOKEN }}
          MORPHE_GPR_USER: ${{ secrets.MORPHE_GPR_USER || github.actor }}
          MORPHE_GPR_KEY: ${{ secrets.MORPHE_GPR_KEY || secrets.GITHUB_TOKEN }}
