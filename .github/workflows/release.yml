name: Gated dev prerelease

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish the built bundle as a dev prerelease
        type: boolean
        required: true
        default: false

permissions:
  contents: write

# Serialize source updates and releases so manifests cannot race.
concurrency:
  group: morphe-dev-releases
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create repo-scoped release token
        if: github.event_name == 'push' || inputs.publish_prerelease == true
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MORPHE_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MORPHE_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: morphe-patches
          permission-contents: write
          permission-workflows: write

      - name: Checkout current dev head
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install release dependencies
        run: npm ci

      - name: Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_GPR_USER: ${{ secrets.MORPHE_GPR_USER || github.actor }}
          MORPHE_GPR_KEY: ${{ secrets.MORPHE_GPR_KEY || secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:test :extensions:youtube:testDebugUnitTest generatePatchesList --no-daemon

      - name: Build Android bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_GPR_USER: ${{ secrets.MORPHE_GPR_USER || github.actor }}
          MORPHE_GPR_KEY: ${{ secrets.MORPHE_GPR_KEY || secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Lint generated bundle and patch list
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_GPR_USER: ${{ secrets.MORPHE_GPR_USER || github.actor }}
          MORPHE_GPR_KEY: ${{ secrets.MORPHE_GPR_KEY || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = //p' gradle.properties | tail -n 1)"
          jq --arg version "$version" '.version = $version' patches-list.json > patches-list.json.tmp
          mv patches-list.json.tmp patches-list.json
          bundle="patches/build/libs/patches-${version}.mpp"
          test -f "$bundle"
          jq --arg v "$version" --arg repo "$GITHUB_REPOSITORY" \
            '.version = $v | .download_url = ("https://github.com/" + $repo + "/releases/download/v" + $v + "/patches-" + $v + ".mpp") | .signature_download_url = ""' \
            patches-bundle.json > "$RUNNER_TEMP/patches-bundle.json"
          python3 .github/scripts/verify_magnifier_bundle.py \
            --bundle "$bundle" --patch-list patches-list.json \
            --manifest "$RUNNER_TEMP/patches-bundle.json" --expected-repo "$GITHUB_REPOSITORY"

      - name: Upload bundle for review
        if: inputs.publish_prerelease != true && github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: patches/build/libs/*.mpp

      - name: Seed fork dev release baseline
        if: github.event_name == 'push' || inputs.publish_prerelease == true
        shell: bash
        run: |
          set -euo pipefail
          # Original fork baseline: a tag-only anchor with no release behind it.
          if ! git tag --list 'v1.48.0' | grep -q .; then
            git tag v1.48.0 f3acc10e2
          fi

          # Re-anchor the dev channel above the fork's stable line.
          #
          # semantic-release derives a prerelease branch's base from the newest
          # tag reachable on that branch, and patch-class commits only tick the
          # counter. The dev base therefore drifted down to 2.0.0-dev.N while the
          # stable channel advanced to 2.2.1, so dev prereleases now sort below
          # the published stable release. Seeding upstream's next stable plus one
          # patch (2.3.0 + patch -> 2.3.1) makes the next dev release 2.3.1-dev.1,
          # which sorts above both 2.2.1 and upstream's own dev line.
          #
          # A hand-made prerelease tag is ignored unless it carries a released
          # channel note: semantic-release resolves channels from
          # refs/notes/semantic-release-* and defaults to [null] otherwise. The
          # note below uses the same ref name shape semantic-release writes for
          # its own releases. The tag targets a note-free ancestor of the dev
          # head, which keeps the analyzed range to the triggering commit so the
          # release stays patch-class. The tag and note are per-run and local,
          # exactly like the v1.48.0 seed above, and never reach main.
          DEV_BASE_TAG='v2.3.1-dev.0'
          DEV_BASE_COMMIT='307cc4039'
          DEV_BASE_CHANNELS='{"channels":["dev"]}'
          if ! git tag --list "$DEV_BASE_TAG" | grep -q .; then
            # A note is stored as a commit of its own, so it needs a committer
            # identity even though creating the tag itself does not.
            git tag "$DEV_BASE_TAG" "$DEV_BASE_COMMIT"
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              notes --ref "refs/notes/semantic-release-$DEV_BASE_TAG" \
              add -f -m "$DEV_BASE_CHANNELS" "$DEV_BASE_TAG"
          fi

          # Fail loudly if the anchor is unreachable or its note is not readable
          # through the same query semantic-release uses, rather than silently
          # publishing a version below the fork's stable line.
          git cat-file -e "${DEV_BASE_COMMIT}^{commit}"
          seed_line="$(git log --tags='*' --decorate-refs='refs/tags/*' --no-walk \
            --format='%d%x09%N' --notes='refs/notes/semantic-release*' \
            | grep -F "(tag: $DEV_BASE_TAG)" || true)"
          if [[ "$seed_line" != *"$DEV_BASE_CHANNELS"* ]]; then
            echo "::error::$DEV_BASE_TAG is not readable as a dev-channel baseline release." >&2
            exit 1
          fi

      - name: Publish dev prerelease
        id: semantic-release
        if: github.event_name == 'push' || inputs.publish_prerelease == true
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token || secrets.GITHUB_TOKEN }}
          MORPHE_GPR_USER: ${{ secrets.MORPHE_GPR_USER || github.actor }}
          MORPHE_GPR_KEY: ${{ secrets.MORPHE_GPR_KEY || secrets.GITHUB_TOKEN }}

      - name: Enforce fork manifest URL after release preparation
        if: (github.event_name == 'push' || inputs.publish_prerelease == true) && steps.semantic-release.outputs.new_release_published == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token || secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("patches-bundle.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          version = data["version"]
          data["download_url"] = f"https://github.com/{os.environ['REPOSITORY']}/releases/download/v{version}/patches-{version}.mpp"
          data["signature_download_url"] = ""
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          if ! git diff --quiet -- patches-bundle.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add patches-bundle.json
            git commit -m 'fix: keep dev bundle manifest on fork release [skip ci]'
            git push origin HEAD:dev
          fi

      - name: Verify the published fork asset through its manifest
        if: (github.event_name == 'push' || inputs.publish_prerelease == true) && steps.semantic-release.outputs.new_release_published == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token || secrets.GITHUB_TOKEN }}
          MORPHE_GPR_USER: ${{ secrets.MORPHE_GPR_USER || github.actor }}
          MORPHE_GPR_KEY: ${{ secrets.MORPHE_GPR_KEY || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_magnifier_bundle.py \
            --patch-list patches-list.json --manifest patches-bundle.json \
            --expected-repo "$GITHUB_REPOSITORY" --download-asset
