name: Stable upstream sync and magnifier release

on:
  push:
    branches: [main]
  schedule:
    - cron: '37 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: morphe-stable-release
  cancel-in-progress: false

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - name: Create repository automation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MORPHE_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MORPHE_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: morphe-patches
          permission-contents: write
          permission-workflows: write

      - name: Checkout stable source
        id: checkout-source
        uses: actions/checkout@v7
        with:
          # A manual dispatch can exercise a reviewed candidate branch end to
          # end. Scheduled and push runs always build from main.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Guard fork write target
        id: target-guard
        env:
          EXPECTED_FORK_REPOSITORY: TankKunn/morphe-patches
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "$EXPECTED_FORK_REPOSITORY" || "$GITHUB_REPOSITORY" == MorpheApp/* ]]; then
            echo "Refusing writes: unexpected repository $GITHUB_REPOSITORY" >&2
            exit 1
          fi
          origin_url="$(git remote get-url origin)"
          normalized_origin="${origin_url%.git}"
          if [[ "$normalized_origin" != "https://github.com/$GITHUB_REPOSITORY" && \
                "$normalized_origin" != "git@github.com:$GITHUB_REPOSITORY" ]]; then
            echo "Refusing writes: origin is not $GITHUB_REPOSITORY" >&2
            exit 1
          fi
          echo "Verified write target: $GITHUB_REPOSITORY"

      - name: Set up build tools
        id: setup-java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Prepare upstream stable candidate
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/stable-sync.log") 2>&1
          trap 'status=$?; failed_command="$BASH_COMMAND"; if [[ ! -s "$RUNNER_TEMP/conflicts.txt" ]]; then git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt" || true; fi; echo "Stable preparation failed with status $status at: $failed_command"; exit $status' ERR
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/MorpheApp/morphe-patches.git
          # Never import all upstream tags into the fork namespace: both repos
          # publish overlapping v1.49.0-dev.* names, which makes git fetch fail.
          # Resolve the upstream stable release first, then fetch only that tag
          # into FETCH_HEAD. --no-tags prevents automatic tag following too.
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/dev:refs/remotes/origin/dev
          BASE_MAIN="$(git rev-parse origin/main)"
          # Read stable tags from the upstream Git remote without importing
          # them into the fork or making an API request to MorpheApp. All API
          # calls and writes below are scoped to GITHUB_REPOSITORY.
          UPSTREAM_TAG="$(git ls-remote --tags --refs upstream 'refs/tags/v[0-9]*' | \
            awk '{ tag=$2; sub("^refs/tags/", "", tag); if (tag ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/) print tag }' | \
            sort -V | tail -n 1)"
          test -n "$UPSTREAM_TAG"
          [[ "$UPSTREAM_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          UPSTREAM_VERSION="${UPSTREAM_TAG#v}"
          git fetch --no-tags upstream "refs/tags/$UPSTREAM_TAG"
          UPSTREAM_COMMIT="$(git rev-parse 'FETCH_HEAD^{commit}')"
          SOURCE_REF=origin/main
          PATCH_PATH=patches/src/main/kotlin/app/morphe/patches/youtube/layout/player/buttons/MagnifierReconPatch.kt
          if ! git cat-file -e "$SOURCE_REF:$PATCH_PATH" 2>/dev/null; then SOURCE_REF=origin/dev; fi
          SOURCE_HASH="$(for f in \
            extensions/youtube/src/main/java/app/morphe/extension/youtube/videoplayer/MagnifierRecon.java \
            patches/src/main/kotlin/app/morphe/patches/youtube/layout/player/buttons/MagnifierReconPatch.kt \
            extensions/youtube/src/main/java/app/morphe/extension/youtube/settings/Settings.java \
            patches/src/main/resources/addresources/values/youtube/strings.xml; do git show "$SOURCE_REF:$f"; done | sha256sum | cut -d' ' -f1)"
          OLD_UPSTREAM="$(jq -r '.upstream_version // ""' .stable-sync-state.json 2>/dev/null || true)"
          OLD_SOURCE="$(jq -r '.magnifier_sha256 // ""' .stable-sync-state.json 2>/dev/null || true)"
          if git merge-base --is-ancestor "$UPSTREAM_COMMIT" "$BASE_MAIN" && \
             [[ "$OLD_UPSTREAM" == "$UPSTREAM_VERSION" && "$OLD_SOURCE" == "$SOURCE_HASH" ]]; then
            echo 'No upstream stable or approved magnifier changes; nothing to publish.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$UPSTREAM_COMMIT" HEAD; then
            if ! git merge --no-edit --no-ff "$UPSTREAM_COMMIT"; then
              merge_conflicts="$(git diff --name-only --diff-filter=U)"
              while IFS= read -r path; do
                [[ -n "$path" ]] || continue
                case "$path" in
                  .github/workflows/build_pull_request.yml|.github/workflows/release.yml|README.md|AGENTS.md|.releaserc)
                    git checkout --ours -- "$path"
                    git add -- "$path"
                    ;;
                  .github/workflows/crowdin_pull.yml|.github/workflows/crowdin_push.yml|.github/workflows/open_pull_request.yml)
                    # These fork-disabled workflows stay deleted after sync.
                    git rm -f -- "$path"
                    ;;
                  extensions/youtube/src/main/java/app/morphe/extension/youtube/settings/Settings.java|patches/src/main/resources/addresources/values/youtube/strings.xml)
                    # Start from upstream's current file, then reapply only the
                    # magnifier settings/resources using the overlay script.
                    git checkout --theirs -- "$path"
                    git add -- "$path"
                    ;;
                  *)
                    echo "No safe merge policy for upstream conflict: $path" >&2
                    exit 1
                    ;;
                esac
              done <<< "$merge_conflicts"
              unresolved="$(git diff --name-only --diff-filter=U)"
              if [[ -n "$unresolved" ]]; then
                echo "Unresolved upstream merge paths: $unresolved" >&2
                exit 1
              fi
              git diff --cached --check
              git commit --no-edit
            fi
          fi
          python3 .github/scripts/apply_magnifier_overlay.py --source-ref "$SOURCE_REF"
          printf '{"upstream_version":"%s","magnifier_sha256":"%s"}\n' "$UPSTREAM_VERSION" "$SOURCE_HASH" > .stable-sync-state.json
          RELEASES="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.prerelease == false) | .tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | ltrimstr("v")')"
          FORK_VERSION="$(printf '%s\n' "$RELEASES" | sort -V | tail -n 1)"
          MAX_VERSION="$(printf '%s\n%s\n' "$UPSTREAM_VERSION" "$FORK_VERSION" | sed '/^$/d' | sort -V | tail -n 1)"
          IFS=. read -r MAJOR MINOR PATCH <<< "$MAX_VERSION"
          VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          while git ls-remote --exit-code --tags upstream "refs/tags/v$VERSION" >/dev/null 2>&1 || \
                git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; do
            PATCH=$((PATCH + 1)); VERSION="$MAJOR.$MINOR.$PATCH"
          done
          UPSTREAM_VERSION="$UPSTREAM_VERSION" VERSION="$VERSION" python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('gradle.properties')
          text = p.read_text(encoding='utf-8')
          text, count = re.subn(r'(?m)^version\s*=\s*.*$', 'version = ' + os.environ['VERSION'], text)
          if count != 1: raise SystemExit('Expected one Gradle version property')
          p.write_text(text, encoding='utf-8', newline='')
          PY
          echo "BASE_MAIN=$BASE_MAIN" >> "$GITHUB_ENV"
          echo "UPSTREAM_TAG=$UPSTREAM_TAG" >> "$GITHUB_ENV"
          echo "UPSTREAM_VERSION=$UPSTREAM_VERSION" >> "$GITHUB_ENV"
          echo "SOURCE_REF=$SOURCE_REF" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo 'publish=true' >> "$GITHUB_OUTPUT"

      - name: Run patch and extension tests
        id: tests
        if: steps.prepare.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_GPR_USER: ${{ secrets.MORPHE_GPR_USER || github.actor }}
          MORPHE_GPR_KEY: ${{ secrets.MORPHE_GPR_KEY || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/stable-sync.log") 2>&1
          ./gradlew :patches:test :extensions:youtube:testDebugUnitTest --no-daemon

      - name: Generate patch list
        id: patch-list
        if: steps.prepare.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_GPR_USER: ${{ secrets.MORPHE_GPR_USER || github.actor }}
          MORPHE_GPR_KEY: ${{ secrets.MORPHE_GPR_KEY || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/stable-sync.log") 2>&1
          ./gradlew generatePatchesList --no-daemon

      - name: Build and lint stable bundle
        id: build
        if: steps.prepare.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_GPR_USER: ${{ secrets.MORPHE_GPR_USER || github.actor }}
          MORPHE_GPR_KEY: ${{ secrets.MORPHE_GPR_KEY || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/stable-sync.log") 2>&1
          ./gradlew :patches:buildAndroid --no-daemon
          jq --arg v "$VERSION" '.version = $v' patches-list.json > patches-list.json.tmp
          mv patches-list.json.tmp patches-list.json
          python3 .github/scripts/generate_patches_readme.py "$GITHUB_REPOSITORY" main patches-list.json README.md
          MANIFEST="$RUNNER_TEMP/patches-bundle.json"
          jq --arg v "$VERSION" --arg u "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/patches-$VERSION.mpp" \
            --arg d "Stable Morphe patches with the YouTube video magnifier, based on upstream v$UPSTREAM_VERSION." \
            '.version=$v | .download_url=$u | .signature_download_url="" | .description=$d' \
            patches-bundle.json > "$MANIFEST"
          BUNDLE="patches/build/libs/patches-$VERSION.mpp"
          test -f "$BUNDLE"
          python3 .github/scripts/verify_magnifier_bundle.py --bundle "$BUNDLE" \
            --patch-list patches-list.json --manifest "$MANIFEST" \
            --expected-repo "$GITHUB_REPOSITORY"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"

      - name: Commit candidate and publish stable release
        id: publish
        if: steps.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/stable-sync.log") 2>&1
          git add -A
          git diff --cached --check
          git commit -m "fix: publish stable Morphe patches v$VERSION with magnifier"
          CANDIDATE="$(git rev-parse HEAD)"
          echo "CANDIDATE_SHA=$CANDIDATE" >> "$GITHUB_ENV"
          # Remove the legacy fixed-name candidate left by earlier failed runs.
          git push origin --delete automation/stable-candidate >/dev/null 2>&1 || true
          CANDIDATE_BRANCH="automation/stable-candidate-$GITHUB_RUN_ID"
          git push origin "$CANDIDATE:refs/heads/$CANDIDATE_BRANCH"
          gh release create "v$VERSION" "$BUNDLE" --target "$CANDIDATE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Morphe Patches v$VERSION (stable + magnifier)" \
            --notes "Stable upstream Morphe Patches v$UPSTREAM_VERSION with the reviewed YouTube magnifier. CI tests and bundle lint passed before publication."
          echo 'release_created=true' >> "$GITHUB_OUTPUT"
          python3 .github/scripts/verify_magnifier_bundle.py \
            --patch-list patches-list.json --manifest "$MANIFEST" \
            --expected-repo "$GITHUB_REPOSITORY" --download-asset
          # Do not put a manifest on main (or the release candidate) that points
          # at an asset until the published asset has passed the download and
          # MPP inspection above.
          cp "$MANIFEST" patches-bundle.json
          git add patches-bundle.json
          git diff --cached --check
          python3 .github/scripts/verify_magnifier_bundle.py \
            --bundle "$BUNDLE" --patch-list patches-list.json --manifest patches-bundle.json \
            --expected-repo "$GITHUB_REPOSITORY"
          git commit -m "chore: point stable manifest to verified v$VERSION bundle"
          MANIFEST_COMMIT="$(git rev-parse HEAD)"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          git push origin "$MANIFEST_COMMIT:refs/heads/main"
          echo 'main_updated=true' >> "$GITHUB_OUTPUT"
          git push origin --delete "$CANDIDATE_BRANCH" \
            || echo 'Stable candidate branch cleanup failed; the release and main update are already complete.'

      - name: Report failed sync
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          failed_step="unknown step"
          [[ "${{ steps.app-token.outcome }}" == failure ]] && failed_step="Create repository automation token"
          [[ "${{ steps.checkout-source.outcome }}" == failure ]] && failed_step="Checkout stable source"
          [[ "${{ steps.target-guard.outcome }}" == failure ]] && failed_step="Guard fork write target"
          [[ "${{ steps.setup-java.outcome }}" == failure ]] && failed_step="Set up build tools"
          [[ "${{ steps.setup-python.outcome }}" == failure ]] && failed_step="Set up Python"
          [[ "${{ steps.prepare.outcome }}" == failure ]] && failed_step="Prepare upstream stable candidate"
          [[ "${{ steps.tests.outcome }}" == failure ]] && failed_step="Run patch and extension tests"
          [[ "${{ steps.patch-list.outcome }}" == failure ]] && failed_step="Generate patch list"
          [[ "${{ steps.build.outcome }}" == failure ]] && failed_step="Build and lint stable bundle"
          [[ "${{ steps.publish.outcome }}" == failure ]] && failed_step="Commit candidate and publish stable release"
          issue_title="Stable sync failed at: $failed_step"
          conflicts="$(cat "$RUNNER_TEMP/conflicts.txt" 2>/dev/null || true)"
          tail_log="$(tail -n 40 "$RUNNER_TEMP/stable-sync.log" 2>/dev/null | \
            sed -E -e 's/(github_pat_|gh[pousr]_)[A-Za-z0-9_]{20,}/[REDACTED]/g' \
                   -e 's@[A-Za-z]:\\Users\\[^[:space:]]+@<redacted-path>@g' \
                   -e 's#/home/runner/[^[:space:]]+#<runner-path>#g' || true)"
          body="$(cat <<EOF
          **Failing step:** $failed_step

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          The previous stable release and main manifest remain unchanged unless this run completed the post-upload verification and main update.
          EOF
          )"
          if [[ -n "$conflicts" ]]; then
            body+="

          Unresolved conflicting files:
          ```
          $conflicts
          ```"
          fi
          body+="

          Redacted log tail:
          ```
          ${tail_log:-No command log was captured.}
          ```"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title | jq -r --arg title "$issue_title" \
              '.[] | select(.title == $title) | .number' | head -n 1)"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$issue_title" --body "$body"
          fi

      - name: Roll back unverified stable release
        if: failure() && steps.publish.outcome == 'failure'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_version="$(git show origin/main:patches-bundle.json | jq -r '.version')"
          if [[ "$main_version" == "$VERSION" ]]; then
            echo "Main already references v$VERSION; keeping its release asset."
          else
            target="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" \
              --json targetCommitish --jq '.targetCommitish' 2>/dev/null || true)"
            if [[ -n "$target" && "$target" == "$CANDIDATE_SHA" ]]; then
              gh release delete "v$VERSION" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              echo "Removed unverified v$VERSION release and tag; main manifest was not updated."
            else
              echo "No release matching this run's candidate needs rollback."
            fi
          fi

      - name: Clean up failed stable candidate ref
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set +e
          gh api --silent --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/automation/stable-candidate-$GITHUB_RUN_ID"
